<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>URL Shortener</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f2f5;
        }
        .container {
            margin-top: 100px;
        }
        .result {
            margin-top: 20px;
        }
        .stats-box {
            background-color: #f3fff3;
            border-left: 5px solid #28a745;
            padding: 10px 15px;
            margin-top: 10px;
            border-radius: 8px;
            text-align: left;
            color: #333;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container text-center">
        <h1 class="mb-4">Сократить ссылку</h1>
        <div class="input-group mb-3">
            <input type="text" id="urlInput" class="form-control" placeholder="Введите длинную ссылку...">
            <button class="btn btn-primary" onclick="shortenUrl()">Сократить</button>
        </div>
        <div id="result" class="result"></div>
    </div>

    <script>
        async function shortenUrl() {
            const url = document.getElementById('urlInput').value;
            const response = await fetch('/api/UrlShortener/shorten', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url })
            });

            const resultEl = document.getElementById('result');
            if (response.ok) {
                const data = await response.json();
                resultEl.innerHTML = `
              <div class="alert alert-success">
                <strong>Короткая ссылка:</strong><br>
                <a href="${data.shortUrl}" target="_blank">${data.shortUrl}</a>
                <br><br>
                <button class="btn btn-sm btn-outline-secondary" onclick="viewStats('${data.code}')">Статистика</button>
                <div id="stats-${data.code}" class="stats-box" style="display:none;"></div>
              </div>
            `;
            } else {
                resultEl.innerHTML = `<div class="alert alert-danger">Ошибка: Не удалось сократить ссылку</div>`;
            }
        }

        async function viewStats(code) {
            const response = await fetch(`/api/UrlShortener/stats/${code}`);
            const statsBox = document.getElementById(`stats-${code}`);

            if (response.ok) {
                const data = await response.json();
                statsBox.innerHTML = `
              <strong>Статистика:</strong><br>
              Оригинальная ссылка: <a href="${data.originalUrl}" target="_blank">${data.originalUrl}</a><br>
              Количество переходов: ${data.clickCount}<br>
              Дата создания: ${new Date(data.createdOn).toLocaleString()}
            `;
                statsBox.style.display = 'block';
            } else {
                statsBox.innerHTML = 'Ошибка при получении статистики.';
                statsBox.style.display = 'block';
            }
        }
    </script>
</body>
</html>
